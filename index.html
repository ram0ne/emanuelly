<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Manu <3</title>
<style>
  :root{
    --pink: #f6a8c9;
    --pink-soft: #ffd6e7;
    --bg: #000000;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card{
    width: 100%;
    max-width: 420px;
    border: 2.5px solid var(--pink);
    border-radius: 32px;
    padding: 36px 32px;
    text-align: center;
    background: rgba(255,255,255,0.01);
    animation: appear 0.6s ease;
  }
  @keyframes appear{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .label{
    color: var(--pink);
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 20px 0;
  }
  input[type="text"]{
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    padding: 14px 16px;
    font-size: 1rem;
    text-align: center;
    outline: none;
    letter-spacing: 2px;
  }
  input::placeholder{
    color: #b8b8b8;
    letter-spacing: normal;
  }
  .enter-btn{
    margin-top: 16px;
    border: none;
    border-radius: 10px;
    background: var(--pink);
    color: #1a1a1a;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 12px 20px;
    width: 100%;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .enter-btn:hover{ filter: brightness(1.08); }
  .enter-btn:active{ filter: brightness(0.95); }
  .hint{
    min-height: 20px;
    margin-top: 14px;
    font-size: 0.85rem;
    color: #ff8fae;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .hint.show{ opacity: 1; }

  #next{
    display: none;
    width: 100%;
    max-width: 420px;
    text-align: center;
    color: var(--pink-soft);
    animation: appear 0.6s ease;
  }
  #next h1{
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--pink);
  }
</style>
</head>
<body>

  <div class="card" id="gate">
    <p class="label">Tente acertar a senha bebe: 🤭</p>
    <input type="text" id="pw" placeholder="" autocomplete="off">
    <button class="enter-btn" id="enterBtn">Entrar</button>
    <p class="hint" id="hint">essa não foi... tenta de novo 💗</p>
  </div>

  <div id="next">
    <h1>Chegou até aqui, agora aguarda mais um pouco meu bem 🤷🏻</h1>
  </div>

<script>
  const PASSWORD = "emanuelly1307";
  const input = document.getElementById('pw');
  const hint = document.getElementById('hint');
  const gate = document.getElementById('gate');
  const next = document.getElementById('next');
  const enterBtn = document.getElementById('enterBtn');

  let realValue = '';

  input.addEventListener('beforeinput', (e) => {
    e.preventDefault();
    const start = input.selectionStart;
    const end = input.selectionEnd;

    if(e.inputType === 'insertText' && e.data){
      realValue = realValue.slice(0, start) + e.data + realValue.slice(end);
      input.value = '•'.repeat(realValue.length);
      input.setSelectionRange(start + e.data.length, start + e.data.length);
    } else if(e.inputType === 'deleteContentBackward'){
      if(start === end && start > 0){
        realValue = realValue.slice(0, start - 1) + realValue.slice(end);
        input.value = '•'.repeat(realValue.length);
        input.setSelectionRange(start - 1, start - 1);
      } else if(start !== end){
        realValue = realValue.slice(0, start) + realValue.slice(end);
        input.value = '•'.repeat(realValue.length);
        input.setSelectionRange(start, start);
      }
    } else if(e.inputType === 'deleteContentForward'){
      if(start === end && start < realValue.length){
        realValue = realValue.slice(0, start) + realValue.slice(start + 1);
        input.value = '•'.repeat(realValue.length);
        input.setSelectionRange(start, start);
      }
    }
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      check();
    }
  });

  enterBtn.addEventListener('click', check);

  function check(){
    const value = realValue.trim().toLowerCase();
    if(value === PASSWORD){
      gate.style.display = 'none';
      next.style.display = 'block';
    } else {
      hint.classList.add('show');
      realValue = '';
      input.value = '';
      input.focus();
    }
  }
</script>

</body>
</html>
