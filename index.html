<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para você</title>
<style>
  :root{
    --pink: #f6a8c9;
    --pink-soft: #ffd6e7;
    --bg: #000000;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  body{
    min-height: 100%;
    margin: 0;
    padding: 24px;
    display: flex;
    background: var(--bg);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  /* ---------- TELA DA SENHA ---------- */
  .card{
    width: 100%;
    max-width: 420px;
    margin: auto;
    border: 2.5px solid var(--pink);
    border-radius: 32px;
    padding: 36px 32px;
    text-align: center;
    animation: appear 0.6s ease;
  }
  @keyframes appear{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .label{ color: var(--pink); font-weight: 700; font-size: 1.15rem; margin: 0 0 20px; }
  input[type="password"]{
    width: 100%; border: none; border-radius: 10px; background: #fff;
    padding: 14px 16px; font-size: 1rem; text-align: center; outline: none;
  }
  .enter-btn{
    margin-top: 16px; border: none; border-radius: 10px; background: var(--pink);
    color: #1a1a1a; font-weight: 700; font-size: 0.95rem; padding: 12px 20px;
    width: 100%; cursor: pointer; transition: filter .15s ease;
  }
  .enter-btn:hover{ filter: brightness(1.08); }
  .hint{ min-height: 20px; margin: 14px 0 0; font-size: .85rem; color: #ff8fae; opacity: 0; transition: opacity .2s; }
  .hint.show{ opacity: 1; }

  /* ---------- PÁGINA PRINCIPAL ---------- */
  #main{
    display: none;
    width: 100%;
    max-width: 550px;
    margin: auto;
    position: relative;
    z-index: 1;
    animation: appear 0.8s ease;
  }
  .player{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--pink);
    padding: 12px 18px;
    margin-bottom: 20px;
  }
  .play-btn{
    flex: none;
    width: 38px; height: 38px;
    border: none; border-radius: 50%;
    background: #000; color: var(--pink);
    font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .player-info{ flex: 1; min-width: 0; }
  .song-title{
    color: #000; font-weight: 700; font-size: .9rem;
    text-transform: uppercase; margin: 0 0 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress{ height: 4px; background: rgba(0,0,0,.25); border-radius: 2px; overflow: hidden; }
  .progress-bar{ height: 100%; width: 0; background: #000; }

  .text-box{
    width: 100%;
    max-width: 405px;
    min-height: 510px;
    margin: 0 auto;
    border: 3px solid var(--pink);
    border-radius: 60px;
    padding: 28px 24px;
    text-align: center;
  }
  .text-box p{
    color: var(--pink);
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.45;
    margin: 0 0 4px;
  }

  /* ---------- CHUVA ---------- */
  #rain{ position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .drop{
    position: absolute; top: -50px;
    user-select: none;
    animation: fall linear forwards;
  }
  .drop.word{ color: var(--pink); font-weight: 700; }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(var(--rot, 0deg)); }
  }
</style>
</head>
<body>

  <!-- TELA DA SENHA -->
  <div class="card" id="gate">
    <p class="label">Tente acertar a senha: 🤭</p>
    <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="enter-btn" id="enterBtn">Entrar</button>
    <p class="hint" id="hint">essa não foi... tenta de novo 💗</p>
  </div>

  <!-- CHUVA DE EMOJIS -->
  <div id="rain"></div>

  <!-- PÁGINA PRINCIPAL -->
  <div id="main">

    <!-- ================================================================
         🎵 MÚSICA: coloque o arquivo .mp3 na mesma pasta do index.html
         e troque o nome em src="musica.mp3" abaixo.
         ================================================================ -->
    <audio id="audio" src="musica.mp3" preload="auto" loop></audio>

    <div class="player">
      <button class="play-btn" id="playBtn" aria-label="Tocar música">▶</button>
      <div class="player-info">
        <!-- ✏️ Troque pelo nome da sua música -->
        <p class="song-title">Nome da música</p>
        <div class="progress"><div class="progress-bar" id="bar"></div></div>
      </div>
    </div>

    <div class="text-box">
      <!-- ================================================================
           ✏️ TEXTO: escreva sua mensagem aqui dentro.
           Cada <p>...</p> é uma linha/parágrafo. Copie, cole e edite à vontade.
           ================================================================ -->
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
      <p>Texto aqui...</p>
    </div>
  </div>

<script>
  const PASSWORD = "emanuelly1307";
  const input = document.getElementById('pw');
  const hint = document.getElementById('hint');
  const gate = document.getElementById('gate');
  const main = document.getElementById('main');

  input.addEventListener('keydown', e => { if(e.key === 'Enter') check(); });
  document.getElementById('enterBtn').addEventListener('click', check);

  function check(){
    if(input.value.trim().toLowerCase() === PASSWORD){
      gate.style.display = 'none';
      main.style.display = 'block';
      startRain();
    } else {
      hint.classList.add('show');
      input.value = '';
      input.focus();
    }
  }

  /* ---------- Player ---------- */
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const bar = document.getElementById('bar');

  playBtn.addEventListener('click', () => {
    if(audio.paused){ audio.play().catch(() => {}); }
    else { audio.pause(); }
  });
  audio.addEventListener('play',  () => playBtn.textContent = '❚❚');
  audio.addEventListener('pause', () => playBtn.textContent = '▶');
  audio.addEventListener('timeupdate', () => {
    if(audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });

  /* ---------- Chuva de ❤️ 😍 e "Emanuelly" ---------- */
  const ITEMS = ['❤️', '😍', 'Emanuelly'];
  const rain = document.getElementById('rain');

  function startRain(){
    setInterval(() => {
      const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
      const el = document.createElement('span');
      el.className = 'drop' + (item === 'Emanuelly' ? ' word' : '');
      el.textContent = item;
      el.style.left = Math.random() * 96 + 'vw';
      el.style.fontSize = (item === 'Emanuelly' ? 14 + Math.random() * 8 : 18 + Math.random() * 20) + 'px';
      el.style.animationDuration = (5 + Math.random() * 5) + 's';
      el.style.opacity = 0.55 + Math.random() * 0.45;
      el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
      rain.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }, 350);
  }
</script>

</body>
</html>
